# Civilizations: the 14 of Civ 1, plus the barbarians.
# Source: OpenCivOne GameData.cs (NationDefinition array). City names are the original ones.
# name: adjective ("the Roman capital"), nation: the people ("the Romans").
# personality, each -1, 0 or 1:
#   mood:     -1 friendly      .. 1 aggressive
#   policy:   -1 perfectionist .. 1 expansionist
#   ideology: -1 militaristic  .. 1 civilized
# playable: false = never picked as a regular civilization (barbarians).

