# A set of rules of its own (see config/rulesets/civ1/ruleset.yaml for how it works).
# Civilization I, rebalanced: a new unit at every era for each line (defense, fast units, siege,
# transports, warships), cannons that ignore walls, one Power Plant, a Sewer System and a
# Harbour, wonders that never become obsolete, no senate to keep a Republic or a Democracy at
# peace, pillage, culture that pushes back the borders of each city (Theatre, Museum, Drama,
# Humanism, the Parthenon and the Louvre). Design notes and odds:
