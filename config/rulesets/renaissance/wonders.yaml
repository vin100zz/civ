# Wonders of the World of Renaissance, those of Golden Ages plus the Parthenon and the Louvre:
# one of each in the whole world. None of them becomes obsolete, and none gives a one-off gift
# but Marco Polo's map: every effect lasts.
# Many act as a building in each of your cities: they are worth that building's cost and upkeep.
# Each also gives its city culture.per_wonder culture per turn (game.yaml).
#
# Effects use the same format as buildings.yaml, plus:
#   happy                - makes `amount` content citizens happy
#   no_unhappy           - no unhappy citizens at all
#   tile_trade_bonus     - +amount trade on every worked tile that already yields trade
#   acts_as_building     - the affected cities count as having `building`
#   free_government      - no anarchy on revolution, and any government can be chosen
#   free_techs           - one shot: `count` advances on completion
#   shared_knowledge     - receive any advance known by `min_civs` other civilizations
#   military_unhappiness - changes unhappiness caused by each military unit abroad
#   peace_keeper         - other civilizations always accept peace with the owner
#   unit_moves           - +amount moves for units of `domain` (several do not add up);
#                          scope continent: only for units on the wonder's continent
#   pollution_percent    - industrial pollution of the affected cities is multiplied by percent/100
#   reveal_map           - one shot: the owner discovers the whole world on completion

# ── ANCIENT ───────────────────────────────────────────────────────────────────
- id: colossus
  name: Colossus
  cost: 200
  requires: bronze_working
  description: +1 trade on every tile of this city that already produces trade.
  effects:
    - {type: tile_trade_bonus, amount: 1}

- id: stonehenge
  name: Stonehenge
  cost: 200
  requires: ceremonial_burial
  description: Acts as a Temple in each of your cities on the same continent.
  effects:
    - {type: acts_as_building, building: temple, scope: continent}

- id: pyramids
  name: Pyramids
  cost: 250
  requires: masonry
  description: Acts as a Granary in each of your cities.
  effects:
    - {type: acts_as_building, building: granary, scope: player}

- id: hanging_gardens
  name: Hanging Gardens
  cost: 250
  requires: pottery
  description: One extra happy citizen in each of your cities.
  effects:
    - {type: happy, amount: 1, scope: player}

- id: lighthouse
  name: Lighthouse
  cost: 150
  requires: map_making
  description: +1 movement for your sea units.
  effects:
    - {type: unit_moves, domain: sea, amount: 1, scope: player}

- id: oracle
  name: Oracle
  cost: 250
  requires: mysticism
  description: Doubles the effect of your Temples.
  effects:
    - {type: content, amount: 1, scope: player, requires_building: temple}
    - {type: content, amount: 1, scope: player, requires_building: temple, requires_tech: mysticism}

- id: great_library
  name: Great Library
  cost: 300
  requires: literacy
  description: You receive any advance already known by two other civilizations. Acts as a Library in its city.
  effects:
    - {type: shared_knowledge, min_civs: 2, scope: player}
    - {type: acts_as_building, building: library}

- id: parthenon
  name: Parthenon
  cost: 250
  requires: drama
  description: +2 culture in each of your cities.
  effects:
    - {type: culture, amount: 2, scope: player}

- id: great_wall
  name: Great Wall
  cost: 300
  requires: engineering
  description: Your cities on the same continent are defended as if they had City Walls.
  effects:
    - {type: acts_as_building, building: city_walls, scope: continent}

- id: marco_polos_embassy
  name: Marco Polo's Embassy
  cost: 200
  requires: trade
  description: Reveals the whole world when completed.
  effects:
    - {type: reveal_map, scope: player}

- id: royal_road
  name: Royal Road
  cost: 400
  requires: bridge_building
  description: +1 movement for your land units on the same continent.
  effects:
    - {type: unit_moves, domain: land, amount: 1, scope: continent}

# ── CLASSICAL AND MEDIEVAL ────────────────────────────────────────────────────
- id: copernicus_observatory
