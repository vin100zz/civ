- id: king_richards_crusade
  name: King Richard's Crusade
  cost: 300
  requires: chivalry
  description: +50% shields in this city.
  effects:
    - {type: yield_bonus, yield: shields, percent: 50, mode: additive}

- id: michelangelos_chapel
  name: Michelangelo's Chapel
  cost: 400
  requires: religion
  description: Acts as a Cathedral in each of your cities.
  effects:
    - {type: acts_as_building, building: cathedral, scope: player}

- id: js_bachs_cathedral
  name: J.S. Bach's Cathedral
  cost: 400
  requires: religion
  description: Two more content citizens in each of your cities.
  effects:
    - {type: content, amount: 2, scope: player}

- id: louvre
  name: Louvre
  cost: 400
  requires: humanism
  description: Acts as a Museum in each of your cities.
  effects:
    - {type: acts_as_building, building: museum, scope: player}

- id: magellans_expedition
  name: Magellan's Expedition
  cost: 300
  requires: navigation
  description: +2 movement for your sea units (does not add up with the Lighthouse).
  effects:
    - {type: unit_moves, domain: sea, amount: 2, scope: player}

- id: shakespeares_theatre
  name: Shakespeare's Theatre
  cost: 300
  requires: medicine
  description: No unhappy citizens in this city.
  effects:
    - {type: no_unhappy}

- id: isaac_newtons_college
  name: Isaac Newton's College
  cost: 400
  requires: theory_of_gravity
  description: Your Libraries and Universities each produce one third more science.
  effects:
    - {type: yield_bonus, yield: science, percent: 33.334, mode: additive, scope: player, requires_building: library}
    - {type: yield_bonus, yield: science, percent: 33.334, mode: additive, scope: player, requires_building: university}

- id: statue_of_liberty
  name: Statue of Liberty
  cost: 400
  requires: democracy
  description: Acts as an Aqueduct in each of your cities. Change government without anarchy.
  effects:
    - {type: acts_as_building, building: aqueduct, scope: player}
    - {type: free_government, scope: player}

# ── INDUSTRIAL ────────────────────────────────────────────────────────────────
- id: darwins_voyage
  name: Darwin's Voyage
  cost: 500
