# Renaissance (Golden Ages with culture) changes to config/game.yaml (merged key by key):
# culture, and the units the shared file names.
# "cavalry" is the industrial unit here, the ancient one is "horsemen"; "sail" is the "caravel".

city:
  forbid_foreign_territory: true

culture:
  enabled: true

huts:
  mercenaries: [legion, horsemen]
  barbarian_units: {open: horsemen, rough: legion}

barbarians:
  units_by_tech_count:
    - {min_techs: 0, units: [legion, horsemen], ship: caravel}
    - {min_techs: 18, units: [knights, catapult, legion], ship: galleon}
    - {min_techs: 35, units: [musketeers, cannon, knights], ship: galleon}
