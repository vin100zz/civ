# Unit definitions.
# Source: OpenCivOne GameData.cs (UnitDefinition array). cost = shields.
# domain: land | sea | air.   role: what the AI uses the unit for
#   (settler, defense, attack, sea_attack, air_attack, transport, carrier, neutral).
# abilities: found_city, terraform (roads, irrigation, mines, fortresses, cleaning pollution),
#   trade (caravan), ignore_zoc, ignore_walls (attacks as if the city had no walls),
#   coastal (may be lost at sea when it ends its turn away from land),
#   attack_air (may attack aircraft in flight), no_shore_attack (cannot attack units on land),
#   nuclear (destroys everything around its target, and itself).
# needs_support: false = costs no shield upkeep (diplomat, caravan).
# fuel: turns an air unit may end away from a city or a carrier before it crashes.
# capacity / carries: number of units a ship carries, and their kind (land | air).
# requires_wonder: some civilization must have built this wonder.
# enabled: false = defined but cannot be built yet.

