# Civ 1 technology tree
# Source: OpenCivOne GameData.cs TechnologyAdvanceDefinition array (faithful C# rewrite of DOS binary)
# At most 2 prerequisites each.
# repeatable: the advance can be researched any number of times (Future Tech).
# era is approximate for UI grouping only

